<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Organiza tu día con una lista de tareas sencilla.">
  <title>Mi día · Tareas</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header><a class="brand" href="./">mi día<span>●</span></a><span class="badge">TU ESPACIO PERSONAL</span></header>
    <section class="intro"><p class="eyebrow">UN PASO A LA VEZ</p><h1>Menos pendientes.<br>Más tranquilidad.</h1><p>Deja tus ideas aquí y concéntrate en lo que sigue.</p></section>
    <section class="board" aria-label="Lista de tareas">
      <div class="board-heading"><h2>Mis tareas</h2><span id="counter" aria-live="polite">0 pendientes</span></div>
      <form id="task-form"><label class="sr-only" for="task-input">Nueva tarea</label><input id="task-input" placeholder="¿Qué quieres hacer hoy?" maxlength="150" required autocomplete="off"><button class="add" type="submit">Agregar <span aria-hidden="true">＋</span></button></form>
      <div class="toolbar"><div class="filters" aria-label="Filtrar tareas"><button type="button" data-filter="all" aria-pressed="true">Todas</button><button type="button" data-filter="pending" aria-pressed="false">Pendientes</button><button type="button" data-filter="done" aria-pressed="false">Completadas</button></div><button id="clear" type="button">Limpiar completadas</button></div>
      <ul id="tasks"></ul>
      <p id="empty">Tu lista está despejada. Agrega tu primera tarea.</p>
      <p id="status" role="status"></p>
    </section>
    <footer><span>Un pequeño espacio para avanzar.</span><span>Guardado en este navegador</span></footer>
  </main>
</body>
</html>
